# CAPI selftest loopback with direct (link-time) API on Xilinx / Cora Z7.
#
# Mirrors loopback.conf but binds capi_<class>_* straight to the platform driver
# via symbol aliases (dropping capi/src/capi_<class>.c) for every class that the
# coraz7s loopback wiring drives through a SINGLE backend variant. Per §2 of the
# direct-API guide, direct mode aliases a class to exactly one implementation, so
# a class the test exercises through two variants at once must stay dispatch-only.
#
# coraz7s variant map (see src/platform/xilinx/parameters.h):
#   UART  console PS  + async PS            -> single variant  -> direct (PS)
#   SPI   PS                                -> single variant  -> direct (PS)
#   GPIO  PS                                -> single variant  -> direct (PS)
#   TIMER AXI (PL XTmrCtr)                  -> single variant  -> direct (PL)
#   I2C   initiator PL + target PS          -> TWO variants    -> dispatch only
#   DMA   no Xilinx backend                 -> dispatcher only, never direct
CONFIG_CAPI=y
CONFIG_CAPI_UART=y
CONFIG_CAPI_ALLOC=y
CONFIG_CAPI_TIME=y
CONFIG_CAPI_GPIO=y
CONFIG_CAPI_IRQ=y
CONFIG_CAPI_SPI=y
CONFIG_CAPI_TIMER=y
CONFIG_CAPI_I2C=y
CONFIG_CAPI_DMA=y

# Direct API only for the single-variant classes on this board.
CONFIG_CAPI_UART_DIRECT_API=y
CONFIG_CAPI_UART_XILINX_DIRECT_PS=y
CONFIG_CAPI_SPI_DIRECT_API=y
CONFIG_CAPI_SPI_XILINX_DIRECT_PS=y
CONFIG_CAPI_GPIO_DIRECT_API=y
CONFIG_CAPI_GPIO_XILINX_DIRECT_PS=y
CONFIG_CAPI_TIMER_DIRECT_API=y
CONFIG_CAPI_TIMER_XILINX_DIRECT_PL=y

# I2C stays dispatch (PL initiator + PS target in one image); DMA has no backend.

CONFIG_CAPI_SELFTEST_LOOPBACK_EXAMPLE=y
CONFIG_XILINX_HDL_DESIGN="test_capi_selftest"
