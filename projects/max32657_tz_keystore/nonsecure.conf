# Non-Secure-world half of the MAX32657 TrustZone keystore demo.
#
# Selected as PROJECT_DEFCONFIG for the nested Non-Secure build (driven by the
# Secure build's superbuild CMakeLists). The Non-Secure app only drives the
# console UART (printf); it calls the Secure keystore gateways but owns no
# security-sensitive peripheral of its own.
CONFIG_CAPI=y
CONFIG_CAPI_UART=y
CONFIG_CAPI_ALLOC=y
# The UART runs in polling mode (use_irq = false), but the Maxim UART backend
# references capi_irq_connect()/enable()/disable() unconditionally, so CAPI_IRQ
# must stay enabled for the link to resolve even though no IRQ is used.
CONFIG_CAPI_IRQ=y
