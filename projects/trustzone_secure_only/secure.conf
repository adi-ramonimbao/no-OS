# Secure-only half of the MAX32657 TrustZone producer/consumer split.
#
# Selected as PROJECT_DEFCONFIG for the Secure build. The Secure world brings up
# the console UART to print a banner, then hands peripherals to whatever
# Non-Secure image is combined with it later.
CONFIG_CAPI=y
CONFIG_CAPI_UART=y
CONFIG_CAPI_ALLOC=y
# The UART runs in polling mode (use_irq = false), but the Maxim UART backend
# references capi_irq_connect()/enable()/disable() unconditionally, so CAPI_IRQ
# must stay enabled for the link to resolve even though no IRQ is used.
CONFIG_CAPI_IRQ=y
