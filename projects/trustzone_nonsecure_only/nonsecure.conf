# Non-Secure-only half of the MAX32657 TrustZone producer/consumer split.
#
# Selected as PROJECT_DEFCONFIG for the Non-Secure build. The Non-Secure app
# drives the UART (print), the LED (CAPI GPIO), a millisecond delay (CAPI time),
# and calls back into the Secure world through the gateway veneers.
CONFIG_CAPI=y
CONFIG_CAPI_UART=y
CONFIG_CAPI_ALLOC=y
CONFIG_CAPI_TIME=y
CONFIG_CAPI_GPIO=y
# The UART runs in polling mode (use_irq = false), but the Maxim UART backend
# references capi_irq_connect()/enable()/disable() unconditionally, so CAPI_IRQ
# must stay enabled for the link to resolve even though no IRQ is used.
CONFIG_CAPI_IRQ=y
