# Secure-world half of the MAX32657 TrustZone hello demo.
#
# Selected as PROJECT_DEFCONFIG for the outer (Secure) build. The Secure world
# only needs the console UART to print its banner before handing peripherals to
# the Non-Secure world.
CONFIG_CAPI=y
CONFIG_CAPI_UART=y
CONFIG_CAPI_ALLOC=y
# The UART runs in polling mode (use_irq = false), but the Maxim UART backend
# references capi_irq_connect()/enable()/disable() unconditionally, so CAPI_IRQ
# must stay enabled for the link to resolve even though no IRQ is used.
CONFIG_CAPI_IRQ=y
