# Non-Secure-world half of the MAX32657 TrustZone hello demo.
#
# Selected as PROJECT_DEFCONFIG for the nested Non-Secure build (driven by the
# Secure build's superbuild CMakeLists). The Non-Secure app drives the UART
# (print), the LED (CAPI GPIO), and a millisecond delay (CAPI time).
CONFIG_CAPI=y
CONFIG_CAPI_UART=y
CONFIG_CAPI_ALLOC=y
CONFIG_CAPI_TIME=y
CONFIG_CAPI_GPIO=y
CONFIG_CAPI_IRQ=y
