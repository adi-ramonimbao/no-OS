# Non-Secure-world half of the MAX32657 TrustZone CAPI self-test.
#
# Selected as PROJECT_DEFCONFIG for the nested Non-Secure build (driven by the
# Secure build's superbuild CMakeLists). The Non-Secure app runs the CAPI test
# framework: it drives the console UART (test report transport), a millisecond
# delay (framework wait), the heap (test buffers) and DMA0 (mem-to-mem tests).
CONFIG_CAPI=y
CONFIG_CAPI_UART=y
CONFIG_CAPI_ALLOC=y
CONFIG_CAPI_TIME=y
CONFIG_CAPI_DMA=y
# The UART runs in polling mode (use_irq = false), but the Maxim UART backend
# references capi_irq_connect()/enable()/disable() unconditionally, so CAPI_IRQ
# must stay enabled for the link to resolve even though no IRQ is used.
CONFIG_CAPI_IRQ=y
