# Non-Secure-world half of the MAX32657 TrustZone CAPI self-test.
#
# Selected as PROJECT_DEFCONFIG for the nested Non-Secure build (driven by the
# Secure build's superbuild CMakeLists). The Non-Secure app runs the full
# capi_selftest loopback set (GPIO/IRQ/SPI/TIMER/I2C/UART/DMA) plus the
# TrustZone groups, so every CAPI class the maxim capi_selftest uses is enabled.
CONFIG_CAPI=y
CONFIG_CAPI_UART=y
CONFIG_CAPI_ALLOC=y
CONFIG_CAPI_TIME=y
CONFIG_CAPI_GPIO=y
CONFIG_CAPI_IRQ=y
CONFIG_CAPI_SPI=y
CONFIG_CAPI_TIMER=y
CONFIG_CAPI_I2C=y
CONFIG_CAPI_DMA=y
